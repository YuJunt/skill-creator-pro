name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          for f in scripts/*.py; do
            python -m py_compile "$f" || exit 1
          done
          echo "✅ All scripts compile successfully"

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Validate skill itself
        run: |
          python scripts/validate_skill.py .

      - name: Security scan
        run: |
          python scripts/security_scan.py . --json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyflakes

      - name: pyflakes check
        run: |
          pyflakes scripts/ tests/ || true

      - name: Check for hardcoded paths
        run: |
          if grep -rn "/home/user" scripts/ --include="*.py" | grep -v "#" | grep -v "用法"; then
            echo "❌ Found hardcoded /home/user paths"
            exit 1
          fi
          echo "✅ No hardcoded paths"

  package:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          chmod +x scripts/package.sh
          bash scripts/package.sh --output dist/ --skip-validate

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-creator-pro-package
          path: dist/*.zip
