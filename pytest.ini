[pytest]
# pytest配置文件

# 注册自定义标记
markers =
    regression: 回归测试（确保已修复的bug不会再次出现）
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    security: 安全测试
    performance: 性能测试
    edge: 边界条件测试

# 测试路径
testpaths = tests

# 输出格式
addopts = -v --tb=short

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
